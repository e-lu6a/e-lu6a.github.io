            <div class="site-preferences" hidden>
    <button type="button" class="site-preferences-option is-active" aria-pressed="true" data-font="mono">mono</button>
    <span class="site-preferences-sep">·</span>
    <button type="button" class="site-preferences-option" aria-pressed="false" data-font="serif">serif</button>
</div>
<script>
    (function () {
        var KEY = "site-preferences-font";
        var strip = document.querySelector(".site-preferences");
        var buttons = document.querySelectorAll(".site-preferences-option");

        function apply(font) {
            document.body.classList.toggle("font-serif", font === "serif");
            for (var i = 0; i < buttons.length; i++) {
                var active = buttons[i].dataset.font === font;
                buttons[i].classList.toggle("is-active", active);
                buttons[i].setAttribute("aria-pressed", active ? "true" : "false");
            }
        }

        
        
        var saved = "mono";
        try { saved = localStorage.getItem(KEY) || "mono"; } catch (e) {}
        apply(saved);
        strip.hidden = false;

        for (var i = 0; i < buttons.length; i++) {
            buttons[i].addEventListener("click", function () {
                try { localStorage.setItem(KEY, this.dataset.font); } catch (e) {}
                apply(this.dataset.font);
            });
        }
    })();
</script>
